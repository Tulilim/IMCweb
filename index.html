<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Europa Project</title>
    <style>
        *{
            margin:0px;
            padding: 0px;
            box-sizing: border-box;
        }
        body{
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            flex-direction: column;
            margin: 0;
            font-family: 'Trebuchet MS' sans-serif;
            font-size: 18px;
            background: linear-gradient(purple, blue);
        }
        
        
        .interface{
            text-align: center;
            padding: 25px;
            width: 300px;
            height: 270px;
            background-color: rgb(120, 252, 208, 0.5);
            border-radius: 25px ;
        }
        .button_calculation{
            font-size: 1.2em;
            padding: 12px 30px;
            border-radius: 50px;
            border: none;
            background-color: black;
            color: white;
            cursor: pointer;
            margin-top: 15px;
        }
        h1 {
            font-family: 'Courier New', Courier, monospace;
            font-weight: 700;
            font-size: 2.0em;
        }

        input{
            width: 100%;
            box-sizing: border-box;
            font-size: 1em;
            padding: 10px 14px;
            border-radius: 15px;
            text-align: left;
            font-size: 1em;
            border: 1px solid rgba(4, 4, 250);
            margin-top: 10px;
            margin-bottom: 10px;
            outline: none;
            transition: all 0.3s ease;
            background-color: rgba(255, 255, 255, 0.5);
            
        }
        input:focus {
            border: 1px;
        }
        p{
            text-align: left;
            width: 100%;
            margin: 0px auto;
            font-size: 1.2em
        }

    </style>
</head>
<body>
    <div class="interface">
        <h1>IMC calculator!</h1>
    <p>
        <label>Weight (kg):</label>
        <input type="number" id="weight" placeholder="70.0">
    </p>
    <p>
        <label>Height (m):</label>
        <input type="number" id="height" placeholder="1.70">
    </p>
    <button class = "button_calculation" id = "calculate_button" >Calculate IMC</button>
    <div id = "resultado" ></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
