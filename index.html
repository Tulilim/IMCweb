<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Europa Project</title>
    <style>
        *{
            margin:0px;
            padding: 0px;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-color: rgb(0, 0, 0, 0.3);
        }
        
        .interface{
            text-align: center;
            padding: 25px;
            width: 250px;
            height: 250px;
            background-color: rgb(120, 252, 208, 0.5);
            border-radius: 25px ;
        }

    </style>
</head>
<body>
    <div class="interface">
        <h1>IMC calculator!</h1>
    <p>
        <label>Peso (kg):</label>
        <input type="number" id="weight" placeholder="70.0">
    </p>
    <p>
        <label>altura (m):</label>
        <input type="number" id="height" placeholder="1.70">
    </p>
    <button id = "calculate_button" >Calculate IMC</button>
    <div id = "resultado" ></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
