<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Europa Project</title>
    <style>
        body{
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            flex-direction: column;
            margin: 0;
            font-family: 'Trebuchet MS' sans-serif;
            font-size: 18px;
            background: linear-gradient(rgb(180, 0, 252), rgb(255, 137, 249));
        }
        
        
        .interface{
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            justify-content: center;
            width: 500px;
            height: 400px;
            background-color: rgba(151, 141, 245, 0.3);
            border-radius: 15px;
            border: 2px solid black;
            border-radius: 25px ;
        }
        .button_calculation{
            font-size: 1.2em;
            padding: 12px 30px;
            border-radius: 50px;
            border: none;
            background-color: black;
            color: rgb(255, 255, 255);
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.6s ease, transform  0.2s ease;
        }
        .button_calculation:hover {
            background-color: #090df3;
            transform: scale(1.05);
            
        }
        h1 {
            font-family: 'Georgia', serif;
            font-weight: 700;
            font-size: 2.0em;
        }

        #result {
            font-size: 1.3em;
            margin-top: 15px;
        }
        input{
            width: 100%;
            box-sizing: border-box;
            font-size: 1em;
            padding: 10px 14px;
            border-radius: 15px;
            text-align: left;
            font-size: 1em;
            border: 1px solid rgba(255, 255, 255, 0.6);
            margin-top: 5px;
            margin-bottom: 15px;
            outline: none;

            transition: all 0.3s ease;
            background-color: rgba(255, 255, 255, 0.5);
            
        }
        input:focus {
            border: 1px solid #090df3;
            background-color: rgba(253, 249, 249, 0.8);
            box-shadow: 0 0 0 3px rgba(9, 196, 243, 0.3);
        }
        p{
            text-align: left;
            width: 300px;
            margin: 0px auto;
            font-size: 1.2em
        }
        .result-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 100px;
            background-color: rgba(25, 0, 255, 0.3);
            font-size: 25px;
            border: 2px solid black;
            border-radius: 15px;
            padding: 15px 25px;
        }
    </style>
</head>
<body>
    <div class="interface">
        <h1>IMC CALCULATOR!</h1>
    <p>
        <label>Weight (kg):</label>
        <input type="number" id="weight" placeholder="70.0">
    </p>
    <p>
        <label>Height (m):</label>
        <input type="number" id="height" placeholder="1.70">
    </p>
    <button class = "button_calculation" id = "calculate_button" >Calculate IMC</button>
    </div>
    <div class="result-container">
        <div id = "resultado" ></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
